<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quick Tickets — печатные макеты</title>
  <style id="page-style"></style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="assets/logo.svg" alt=""><div><strong>Печатные афиши</strong><span>v1.3 · единый renderer</span></div></div>
    <div class="controls">
      <div class="field"><label for="format">Формат</label><select id="format"></select></div>
      <div class="field"><label for="orientation">Ориентация</label><select id="orientation"></select></div>
      <div class="field"><label for="layout">Макет</label><select id="layout"></select></div>
      <div class="actions"><button id="prev" type="button">←</button><button id="next" type="button">→</button><button id="print" type="button">Печать</button></div>
    </div>
    <div id="quick" class="quick"></div>
    <div id="meta" class="meta"></div>
    <div id="fit-status" class="fit-status">Проверка…</div>
    <div class="note">Один HTML обслуживает все 60 физических макетов. Геометрия берётся из спецификации в миллиметрах; переключение формата выбирает другой layout, а не масштабирует текущий.</div>
  </aside>
  <main id="stage" class="stage"><div id="sheet-scale" class="sheet-scale"><article id="sheet" class="sheet"></article></div></main>
</div>
<script src="bundle/part-00.js"></script>
<script src="bundle/part-01.js"></script>
<script src="bundle/loader.js"></script>
</body>
</html>
